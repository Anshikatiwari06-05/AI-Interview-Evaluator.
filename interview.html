<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interview - AI Interview Evaluator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* ================================
           INTERVIEW PAGE DESIGN
        ================================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8f9ff);
            color: #1f2937;
        }

        /* ================================
           SETUP SECTION
        ================================= */

        #setupSection {
            width: 90%;
            max-width: 650px;
            margin: 70px auto;
            padding: 45px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(31, 41, 55, 0.12);
            text-align: center;
        }

        #setupSection h1 {
            margin-bottom: 10px;
            font-size: 36px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #setupSection h2 {
            margin-bottom: 30px;
            font-size: 22px;
            color: #374151;
        }

        #setupSection label {
            display: block;
            margin-bottom: 10px;
            text-align: left;
            font-weight: 600;
            color: #374151;
        }

        /* ================================
           ROLE SELECT
        ================================= */

        #role {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            font-size: 16px;
            color: #374151;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
        }

        #role:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        /* ================================
           BUTTONS
        ================================= */

        #startBtn,
        #nextBtn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
            transition: all 0.25s ease;
        }

        #startBtn:hover,
        #nextBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.35);
        }

        #startBtn:active,
        #nextBtn:active {
            transform: translateY(0);
        }

        /* ================================
           INTERVIEW SECTION
        ================================= */

        #interviewSection {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(31, 41, 55, 0.12);
        }

        #interviewSection h1 {
            margin-bottom: 8px;
            font-size: 32px;
            color: #4f46e5;
        }

        #progressText {
            margin-bottom: 30px;
            color: #6b7280;
            font-size: 15px;
        }

        /* ================================
           QUESTION
        ================================= */

        #questionText {
            margin-bottom: 25px;
            padding: 22px;
            border-left: 5px solid #6366f1;
            border-radius: 12px;
            background: #f5f3ff;
            color: #312e81;
            font-size: 21px;
            line-height: 1.5;
        }

        /* ================================
           ANSWER TEXTAREA
        ================================= */

        #answerInput {
            width: 100%;
            min-height: 180px;
            padding: 18px;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            resize: vertical;
            outline: none;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.6;
            color: #374151;
            transition: 0.3s;
        }

        #answerInput:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
        }

        #answerInput::placeholder {
            color: #9ca3af;
        }

        /* ================================
           PROGRESS BAR
        ================================= */

        #interviewSection > div:last-child {
            margin-top: 25px;
            height: 10px;
            overflow: hidden;
            border-radius: 20px;
            background: #e5e7eb !important;
        }

        #progressBar {
            height: 10px;
            border-radius: 20px;
            background: linear-gradient(90deg, #4f46e5, #8b5cf6);
            transition: width 0.5s ease;
        }

        /* ================================
           MOBILE RESPONSIVE
        ================================= */

        @media (max-width: 600px) {

            #setupSection,
            #interviewSection {
                width: 94%;
                margin: 30px auto;
                padding: 25px;
            }

            #setupSection h1 {
                font-size: 28px;
            }

            #interviewSection h1 {
                font-size: 26px;
            }

            #questionText {
                font-size: 18px;
            }

            #answerInput {
                min-height: 150px;
            }

            #startBtn,
            #nextBtn {
                width: 100%;
            }
        }
    </style>

</head>

<body>

    <!-- Interview Setup -->

    <div id="setupSection">

        <h1>AI Interview Evaluator</h1>

        <h2>Start Your Interview</h2>

        <label for="role">
            Select Job Role:
        </label>

        <select id="role">

            <option value="">
                Select Role
            </option>

            <option value="Software Developer">
                Software Developer
            </option>

            <option value="Java Developer">
                Java Developer
            </option>

            <option value="Python Developer">
                Python Developer
            </option>

        </select>

        <br><br>

        <button id="startBtn">
            Start Interview
        </button>

    </div>


    <!-- Interview Section -->

    <div id="interviewSection" style="display: none;">

        <h1>Interview</h1>

        <p id="progressText"></p>

        <h2 id="questionText"></h2>

        <textarea
            id="answerInput"
            rows="8"
            cols="50"
            placeholder="Type your answer here..."></textarea>

        <br><br>

        <button id="nextBtn">
            Next Question
        </button>

        <br><br>

        <!-- Progress Bar -->

        <div style="width: 100%; background: #ddd; height: 10px;">

            <div
                id="progressBar"
                style="width: 0%; height: 10px;">
            </div>

        </div>

    </div>
    <div id="evaluationBox" style="
    display: none;
    margin: 20px 0;
    padding: 20px;
    border-radius: 15px;
    background: #f5f3ff;
    border-left: 5px solid #6c4cff;
">

    <h3>🤖 AI Evaluation</h3>

    <p>
        <strong>Technical Knowledge:</strong>
        <span id="technicalScore"></span>/10
    </p>

    <p>
        <strong>Relevance:</strong>
        <span id="relevanceScore"></span>/10
    </p>

    <p>
        <strong>Clarity:</strong>
        <span id="clarityScore"></span>/10
    </p>

    <p>
        <strong>Completeness:</strong>
        <span id="completenessScore"></span>/10
    </p>

    <p>
        <strong>Overall Score:</strong>
        <span id="overallScore"></span>/10
    </p>

    <p>
        <strong>Feedback:</strong>
        <span id="feedbackText"></span>
    </p>

</div>


    <!-- JavaScript -->

    <script src="{{ url_for('static', filename='js/interview.js') }}"></script>

</body>

</html>
